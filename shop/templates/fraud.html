<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fraud Check</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 640px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Fraud Check</h1>
        <p class="text-muted">Pick a random real transaction and let the model judge it.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-dark w-100">Check a random transaction</button>
        </form>

        {% if result %}
          <ul class="list-group mt-4">
            <li class="list-group-item">Amount: <strong>{{ result.amount }}</strong></li>
            <li class="list-group-item">Fraud probability: <strong>{{ result.probability }}%</strong></li>
            <li class="list-group-item {% if result.predicted == 'Fraud' %}list-group-item-danger{% else %}list-group-item-success{% endif %}">
              Model says: <strong>{{ result.predicted }}</strong>
            </li>
            <li class="list-group-item">Actual label: <strong>{{ result.actual }}</strong></li>
          </ul>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
