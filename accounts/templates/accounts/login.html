{% extends "shop/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
    <p>No account? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}
