{% extends "shop/base.html" %}

{% block title %}My orders{% endblock %}

{% block content %}
<h2>My orders</h2>
{% for o in orders %}
    <div class="card">
        <a href="{% url 'shop:order_detail' o.pk %}">Order #{{ o.pk }}</a>
        - {{ o.get_status_display }} - {{ o.created_at|date:"Y-m-d H:i" }}
    </div>
{% empty %}
    <p>No orders yet.</p>
{% endfor %}
{% endblock %}
