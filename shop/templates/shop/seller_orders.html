{% extends 'shop/base.html' %}
{% block content %}
<h4>سفارش‌های محصولات من</h4>
<table border="1" cellpadding="6">
  <tr><th>سفارش</th><th>خریدار</th><th>محصول</th><th>تعداد</th></tr>
  {% for i in items %}
  <tr><td>#{{ i.order.pk }}</td><td>{{ i.order.buyer.username }}</td><td>{{ i.product.name }}</td><td>{{ i.quantity }}</td></tr>
  {% empty %}<tr><td colspan="4">سفارشی نیست.</td></tr>{% endfor %}
</table>
{% endblock %}
