<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Sentiment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 640px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Review Sentiment</h1>
        <form method="post">
          {% csrf_token %}
          <textarea name="text" class="form-control mb-3" rows="5"
                    placeholder="Write a review in English...">{{ text }}</textarea>
          <button type="submit" class="btn btn-dark w-100">Analyze</button>
        </form>

        {% if result %}
          <div class="mt-4 alert {% if result == 'positive' %}alert-success{% else %}alert-danger{% endif %}">
            {% if result == 'positive' %}Positive review{% else %}Negative review{% endif %}
          </div>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
