{% extends "shop/base.html" %}

{% block content %}
<h2>Products</h2>

<p class="filters">
    <a href="{% url 'shop:product_list' %}">All</a>
    {% for c in categories %}
        <a href="?category={{ c.id }}">{{ c.name }}</a>
    {% endfor %}
</p>

<div class="grid">
    {% for p in products %}
        <div class="card">
            <a href="{% url 'shop:product_detail' p.pk %}">
                <h3>{{ p.name }}</h3>
            </a>
            <p>{{ p.category|default:"No category" }}</p>
            <p class="price">${{ p.price }}</p>
        </div>
    {% empty %}
        <p>No products yet.</p>
    {% endfor %}
</div>
{% endblock %}
