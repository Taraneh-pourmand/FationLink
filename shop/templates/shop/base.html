<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FationLink{% endblock %}</title>
  <style>
    body { font-family: Tahoma, sans-serif; margin: 0; background: #f6f6f6; }
    nav { background: #222; padding: 12px 16px; display: flex; gap: 16px; align-items: center; }
    nav a, nav span { color: #fff; text-decoration: none; }
    nav button { padding: 4px 10px; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    .box { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid #eee; text-align: right; }
    input { padding: 8px; }
    button { padding: 8px 16px; cursor: pointer; }
    .muted { color: #777; font-size: 13px; }
    .error { color: #c00; }
    .total { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
<nav>
  <a href="{% url 'product_list' %}">محصولات</a>
  <a href="{% url 'cart_detail' %}">سبد خرید</a>
  {% if user.is_authenticated %}
    <span>{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}" style="display:inline">
      {% csrf_token %}<button type="submit">خروج</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}">ورود</a>
    <a href="{% url 'signup' %}">ثبت‌نام</a>
  {% endif %}
</nav>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
</body>
</html>
